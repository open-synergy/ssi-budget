        method: action_post
      - step: Find detail with product
        action: search
        model: analytic_budget.detail
        domain:
          - - budget_id
            - "="
            - "REC: budget_1.id"
          - - product_id
            - "="
            - "REC: prod_1.id"
        save_as: detail_product
        limit: 1
        expect_count: 1
      - step: Find detail without product
        action: search
        model: analytic_budget.detail
        domain:
          - - budget_id
            - "="
            - "REC: budget_1.id"
          - - product_id
            - "="
            - false
        save_as: detail_plain
        limit: 1
        expect_count: 1
