        model: analytic_budget.realization_unbudgeted
        domain:
          - - budget_id
            - "="
            - "REC: budget_2.id"
          - - product_id
            - "="
            - "REC: prod_2.id"
        save_as: unbudgeted_2
        expect_count: 1
      - step: Unmatched product line is unbudgeted
        action: assert
        target: unbudgeted_2
        asserts:
          amount_realized:
            type: value
            expected: 200.0
