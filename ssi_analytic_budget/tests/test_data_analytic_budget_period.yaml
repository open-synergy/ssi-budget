options:
  auto_refresh: true
scenarios:
  - name: Realization budgeted - amount budgeted appears once per detail
    steps:
      - step: Get expenses account type
        action: ref
        xml_id: account.data_account_type_expenses
        save_as: acc_type
      - step: Create account Counterpart
        action: create
        model: account.account
        save_as: acc_cp
        values:
          name: AB Period 01 Counterpart
          code: XABP0100
          user_type_id: "REC: acc_type.id"
      - step: Create miscellaneous journal
        action: create
        model: account.journal
        save_as: journal
        values:
          name: AB Period J01
          code: XP01
          type: general
      - step: Create budget type
        action: create
        model: analytic_budget.type
        save_as: budget_type
        values:
          name: AB Period Type 01
          code: ABPT01
      - step: Create account Budgeted
        action: create
        model: account.account
        save_as: acc_a
        values:
          name: AB Period 01 Budgeted
          code: XABP0101
          user_type_id: "REC: acc_type.id"
      - step: Create analytic account Shared
        action: create
        model: account.analytic.account
        save_as: analytic
        values:
          name: AB Period 01 Shared
      - step: Create budget 1 with one revenue detail
        action: create
        model: analytic_budget.budget
        save_as: budget_1
        values:
          type_id: "REC: budget_type.id"
          analytic_account_id: "REC: analytic.id"
          detail_ids:
            - - 0
              - 0
              - name: Detail
                direction: revenue
                account_id: "REC: acc_a.id"
                price_unit: 1000000.0
                uom_quantity: 1.0
        as_user: base.user_admin
      - step: Create budget 2 on the same analytic account
        action: create
        model: analytic_budget.budget
        save_as: budget_2
        values:
          type_id: "REC: budget_type.id"
          analytic_account_id: "REC: analytic.id"
        as_user: base.user_admin
      - step: Create entry move_1
        action: create
        model: account.move
        save_as: move_1
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-01-05"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_a.id"
                debit: 0.0
                credit: 100.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 100.0
                credit: 0.0
      - step: Post entry move_1
        action: call
        target: move_1
        method: action_post
      - step: Create entry move_2
        action: create
        model: account.move
        save_as: move_2
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-01-06"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_a.id"
                debit: 0.0
                credit: 100.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 100.0
                credit: 0.0
      - step: Post entry move_2
        action: call
        target: move_2
        method: action_post
      - step: Create entry move_3
        action: create
        model: account.move
        save_as: move_3
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-01-07"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_a.id"
                debit: 0.0
                credit: 100.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 100.0
                credit: 0.0
      - step: Post entry move_3
        action: call
        target: move_3
        method: action_post
      - step: Flush pending writes
        action: call
        target: budget_1
        method: flush
      - step: Search realization_budgeted rows rows_1
        action: search
        model: analytic_budget.realization_budgeted
        domain:
          - - budget_id
            - "="
            - "REC: budget_1.id"
        save_as: rows_1
        expect_count: 1
      - step: Budgeted amount is not multiplied by the realization dates
        action: assert
        target: rows_1
        asserts:
          amount_budgeted:
            type: value
            expected: 1000000.0
          amount_realized:
            type: value
            expected: 300.0
      - step: Search realization_budgeted rows rows_2
        action: search
        model: analytic_budget.realization_budgeted
        domain:
          - - budget_id
            - "="
            - "REC: budget_2.id"
        save_as: rows_2
        expect_count: 0
  - name: Period - detail and header realization are limited to the period
    steps:
      - step: Get expenses account type
        action: ref
        xml_id: account.data_account_type_expenses
        save_as: acc_type
      - step: Create account Counterpart
        action: create
        model: account.account
        save_as: acc_cp
        values:
          name: AB Period 02 Counterpart
          code: XABP0200
          user_type_id: "REC: acc_type.id"
      - step: Create miscellaneous journal
        action: create
        model: account.journal
        save_as: journal
        values:
          name: AB Period J02
          code: XP02
          type: general
      - step: Create budget type
        action: create
        model: analytic_budget.type
        save_as: budget_type
        values:
          name: AB Period Type 02
          code: ABPT02
      - step: Create account No period
        action: create
        model: account.account
        save_as: acc_a
        values:
          name: AB Period 02 No period
          code: XABP0201
          user_type_id: "REC: acc_type.id"
      - step: Create account Q1 period
        action: create
        model: account.account
        save_as: acc_b
        values:
          name: AB Period 02 Q1 period
          code: XABP0202
          user_type_id: "REC: acc_type.id"
      - step: Create analytic account Main
        action: create
        model: account.analytic.account
        save_as: analytic
        values:
          name: AB Period 02 Main
      - step: Create date range type
        action: create
        model: date.range.type
        save_as: drt
        values:
          name: AB Period Type 02
          allow_overlap: true
      - step: Create period Q1 2027
        action: create
        model: date.range
        save_as: q1
        values:
          name: AB Period 02 Q1 2027
          type_id: "REC: drt.id"
          date_start: "2027-01-01"
          date_end: "2027-03-31"
      - step: Create budget budget
        action: create
        model: analytic_budget.budget
        save_as: budget
        values:
          type_id: "REC: budget_type.id"
          analytic_account_id: "REC: analytic.id"
          detail_ids:
            - - 0
              - 0
              - name: No period
                direction: revenue
                account_id: "REC: acc_a.id"
                price_unit: 5000.0
                uom_quantity: 1.0
            - - 0
              - 0
              - name: Q1
                direction: revenue
                account_id: "REC: acc_b.id"
                price_unit: 5000.0
                uom_quantity: 1.0
                period_id: "REC: q1.id"
        as_user: base.user_admin
      - step: Header range is the period of the details
        action: assert
        target: budget
        asserts:
          date_start:
            type: value
            expected: 2027-01-01
          date_end:
            type: value
            expected: 2027-03-31
      - step: Create entry move_1
        action: create
        model: account.move
        save_as: move_1
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-01-10"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_a.id"
                debit: 0.0
                credit: 100.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 100.0
                credit: 0.0
      - step: Post entry move_1
        action: call
        target: move_1
        method: action_post
      - step: Create entry move_2
        action: create
        model: account.move
        save_as: move_2
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-06-10"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_a.id"
                debit: 0.0
                credit: 50.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 50.0
                credit: 0.0
      - step: Post entry move_2
        action: call
        target: move_2
        method: action_post
      - step: Create entry move_3
        action: create
        model: account.move
        save_as: move_3
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-02-10"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 200.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 200.0
                credit: 0.0
      - step: Post entry move_3
        action: call
        target: move_3
        method: action_post
      - step: Create entry move_4
        action: create
        model: account.move
        save_as: move_4
        values:
          move_type: entry
          journal_id: "REC: journal.id"
          date: "2027-05-10"
          line_ids:
            - - 0
              - 0
              - name: Credit
                account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 70.0
                analytic_account_id: "REC: analytic.id"
            - - 0
              - 0
              - name: Balance
                account_id: "REC: acc_cp.id"
                debit: 70.0
                credit: 0.0
      - step: Post entry move_4
        action: call
        target: move_4
        method: action_post
      - step: Find detail detail_a
        action: search
        model: analytic_budget.detail
        domain:
          - - budget_id
            - "="
            - "REC: budget.id"
          - - account_id
            - "="
            - "REC: acc_a.id"
        save_as: detail_a
        limit: 1
        expect_count: 1
      - step: Find detail detail_b
        action: search
        model: analytic_budget.detail
        domain:
          - - budget_id
            - "="
            - "REC: budget.id"
          - - account_id
            - "="
            - "REC: acc_b.id"
        save_as: detail_b
        limit: 1
        expect_count: 1
      - step: Line without period counts every date
        action: assert
        target: detail_a
        asserts:
          amount_realized:
            type: value
            expected: 150.0
      - step: Line with period counts only its range
        action: assert
        target: detail_b
        asserts:
          amount_realized:
            type: value
            expected: 200.0
      - step: Header counts only the range of the budget
        action: assert
        target: budget
        asserts:
          amount_revenue_realization:
            type: value
            expected: 300.0
          amount_cost_realization:
            type: value
            expected: 0.0
      - step: Flush pending writes
        action: call
        target: budget
        method: flush
      - step: Search realization_unbudgeted rows unbudgeted
        action: search
        model: analytic_budget.realization_unbudgeted
        domain:
          - - budget_id
            - "="
            - "REC: budget.id"
        save_as: unbudgeted
        expect_count: 0
  - name: Remainder rule - product line, no-product line and unbudgeted
    steps:
      - step: Get expenses account type
