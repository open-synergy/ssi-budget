options:
  auto_refresh: true

scenarios:
  - name: "Analytic Budget - Full Workflow: draft to done"
    steps:
      - step: "Setup - create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Analytic Account Budget"

      - step: "Setup - create analytic budget type"
        action: "create"
        model: "analytic_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Budget Type AB"
          code: "TBTAB"

      - step: "Create analytic budget"
        action: "create"
        model: "analytic_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          analytic_account_id: "EVAL: registry['analytic_account'].id"

      - step: "Assert budget created in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm budget"
        action: "call"
        target: "budget"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve to open"
        action: "call"
        target: "budget"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Done budget"
        action: "call"
        target: "budget"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Analytic Budget Type - Master Data"
    steps:
      - step: "Create analytic budget type"
        action: "create"
        model: "analytic_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Budget Type MD"
          code: "TBTMD"

      - step: "Assert type created"
        action: "assert"
        target: "budget_type"
        asserts:
          name:
            type: "value"
            expected: "Test Budget Type MD"
          code:
            type: "value"
            expected: "TBTMD"

      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test AA MD"

      - step: "Create analytic budget with type"
        action: "create"
        model: "analytic_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          analytic_account_id: "EVAL: registry['analytic_account'].id"

      - step: "Assert budget in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Analytic Budget - Onchange type fills accounts"
    steps:
      - step: "Get account type expenses"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "account_type_expenses"

      - step: "Create revenue account"
        action: "create"
        model: "account.account"
        save_as: "acc_revenue"
        values:
          name: "Test Revenue Account OC"
          code: "XABOC01"
          user_type_id: "EVAL: registry['account_type_expenses'].id"

      - step: "Create cost account"
        action: "create"
        model: "account.account"
        save_as: "acc_cost"
        values:
          name: "Test Cost Account OC"
          code: "XABOC02"
          user_type_id: "EVAL: registry['account_type_expenses'].id"

      - step: "Create excluded account"
        action: "create"
        model: "account.account"
        save_as: "acc_exclude"
        values:
          name: "Test Excluded Account OC"
          code: "XABOC03"
          user_type_id: "EVAL: registry['account_type_expenses'].id"

      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Analytic Account OC"

      - step: "Create budget type with allowed and excluded accounts"
        action: "create"
        model: "analytic_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Budget Type OC"
          code: "TBTOC"
          allowed_revenue_account_ids: "EVAL: [(6, 0, [registry['acc_revenue'].id])]"
          allowed_cost_account_ids: "EVAL: [(6, 0, [registry['acc_cost'].id])]"
          exclude_account_ids: "EVAL: [(6, 0, [registry['acc_exclude'].id])]"

      - step: "Set type then clear it on the form"
        action: "form"
        model: "analytic_budget.budget"
        save: false
        ops:
          - set: {analytic_account_id: "REC: analytic_account"}
          - set: {type_id: "REC: budget_type"}
          - assert:
              account_ids:
                type: "m2m"
                check: "exact"
                expected_records:
                  - "REC: acc_revenue"
                  - "REC: acc_cost"
              exclude_account_ids:
                type: "m2m"
                check: "exact"
                expected_records:
                  - "REC: acc_exclude"
          - set: {type_id: "EVAL: env['analytic_budget.type']"}
          - assert:
              account_ids:
                type: "m2m"
                check: "count"
                expected_count: 0
              exclude_account_ids:
                type: "m2m"
                check: "count"
                expected_count: 0
