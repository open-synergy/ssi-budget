options:
  auto_refresh: true

scenarios:
  - name: "Ceiling - total up to the financial amount passes, above it fails"
    steps:
      - step: "Setup - expenses account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "acc_type"
      - step: "Setup - account X"
        action: "create"
        model: "account.account"
        save_as: "acc_x"
        values:
          name: "FAB 1 Account X"
          code: "FAB1X"
          user_type_id: "REC: acc_type.id"
      - step: "Setup - financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "fin_type"
        values:
          name: "FAB 1 Financial Type"
          code: "FABF1"
          allowed_account_ids: "EVAL: [(6, 0, [registry['acc_x'].id])]"
      - step: "Setup - analytic budget type"
        action: "create"
        model: "analytic_budget.type"
        save_as: "an_type"
        values:
          name: "FAB 1 Analytic Type"
          code: "FABA1"
      - step: "Setup - top level analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "an_acc"
        values:
          name: "FAB 1 Analytic Account"
      - step: "Setup - yearly range type"
        action: "create"
        model: "date.range.type"
        save_as: "yr_type"
        values:
          name: "FAB 1 Yearly"
      - step: "Setup - company yearly range type"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: "EVAL: registry['yr_type'].id"
      - step: "Setup - yearly range"
        action: "create"
        model: "date.range"
        save_as: "year"
        values:
          name: "FAB 1 Year"
          type_id: "REC: yr_type"
          date_start: "2041-01-01"
          date_end: "2041-12-31"
      - step: "Setup - analytic period range type"
        action: "create"
        model: "date.range.type"
        save_as: "an_drt"
        values:
          name: "FAB 1 Analytic Periods"
          allow_overlap: true
      - step: "Setup - analytic period jan"
        action: "create"
        model: "date.range"
        save_as: "jan"
        values:
          name: "FAB 1 jan"
          type_id: "REC: an_drt"
          date_start: "2041-01-01"
          date_end: "2041-01-31"
      - step: "Setup - analytic period q2"
        action: "create"
        model: "date.range"
        save_as: "q2"
        values:
          name: "FAB 1 q2"
          type_id: "REC: an_drt"
          date_start: "2041-04-01"
          date_end: "2041-06-30"
      - step: "Setup - analytic period mar"
        action: "create"
        model: "date.range"
        save_as: "mar"
        values:
          name: "FAB 1 mar"
          type_id: "REC: an_drt"
          date_start: "2041-03-01"
          date_end: "2041-03-31"
      - step: "Create financial budget fin_yearly"
        action: "create"
        model: "financial_budget.budget"
        save_as: "fin_yearly"
        as_user: "base.user_admin"
        values:
          type_id: "REC: fin_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"
          detail_ids:
            - - 0
              - 0
              - account_id: "REC: acc_x.id"
                direction: "cost"
                amount: 1000000.0
      - step: "Create analytic budget up to the ceiling"
        action: "create"
        model: "analytic_budget.budget"
        save_as: "an_1"
        as_user: "base.user_admin"
        context:
          test_financial_analytic_budget: true
        values:
          type_id: "REC: an_type.id"
          analytic_account_id: "REC: an_acc.id"
          detail_ids:
            - - 0
              - 0
              - name: "Jan"
                direction: "cost"
                account_id: "REC: acc_x.id"
                price_unit: 600000.0
                uom_quantity: 1.0
                period_id: "REC: jan.id"
            - - 0
              - 0
              - name: "Q2"
                direction: "cost"
                account_id: "REC: acc_x.id"
                price_unit: 400000.0
                uom_quantity: 1.0
                period_id: "REC: q2.id"
      - step: "Find financial detail fin_detail"
        action: "search"
        model: "financial_budget.detail"
        save_as: "fin_detail"
        limit: 1
        expect_count: 1
        domain:
          - - "budget_id"
            - "="
            - "REC: fin_yearly.id"
          - - "account_id"
            - "="
            - "REC: acc_x.id"
      - step: "Assert allocated analytic amount"
        action: "assert"
        target: "fin_detail"
        asserts:
          amount_allocated_analytic:
            type: "value"
            expected: 1000000.0
      - step: "Add a line above the ceiling"
        action: "create"
        model: "analytic_budget.detail"
        as_user: "base.user_admin"
        context:
          test_financial_analytic_budget: true
        expect_error:
          type: "ValidationError"
          message_contains: "exceeds the financial budget"
        values:
          budget_id: "REC: an_1.id"
          name: "Mar"
          direction: "cost"
          account_id: "REC: acc_x.id"
          price_unit: 1.0
          uom_quantity: 1.0
          period_id: "REC: mar.id"

