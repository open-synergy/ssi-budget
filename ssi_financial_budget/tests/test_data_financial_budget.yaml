        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type"
          period_id: "REC: period"

      - step: "Create detail line r"
        action: "create"
        model: "financial_budget.detail"
        save_as: "detail_r"
        values:
          budget_id: "REC: budget.id"
          account_id: "REC: account_r.id"
          direction: "revenue"
          amount: 1000000

      - step: "Create detail line c"
        action: "create"
        model: "financial_budget.detail"
        save_as: "detail_c"
        values:
          budget_id: "REC: budget.id"
          account_id: "REC: account_c.id"
          direction: "cost"
          amount: 400000

      - step: "Create journal entry r"
        action: "create"
        model: "account.move"
        save_as: "move_r"
        values:
          journal_id: "REC: journal.id"
          date: "2024-08-15"
          line_ids:
            - [
                0,
                0,
                {
                  name: "Budget line",
                  account_id: "EVAL: registry['account_r'].id",
                  debit: 0.0,
                  credit: 600000.0,
                },
              ]
            - [
                0,
                0,
                {
                  name: "Balancing line",
                  account_id: "EVAL: registry['account_bal'].id",
                  debit: 600000.0,
                  credit: 0.0,
                },
              ]

      - step: "Post journal entry r"
        action: "call"
        target: "move_r"
        method: "action_post"

      - step: "Create journal entry c"
        action: "create"
        model: "account.move"
        save_as: "move_c"
        values:
          journal_id: "REC: journal.id"
          date: "2024-08-16"
          line_ids:
            - [
                0,
                0,
                {
                  name: "Budget line",
                  account_id: "EVAL: registry['account_c'].id",
                  debit: 150000.0,
                  credit: 0.0,
                },
              ]
            - [
                0,
                0,
                {
                  name: "Balancing line",
                  account_id: "EVAL: registry['account_bal'].id",
                  debit: 0.0,
                  credit: 150000.0,
                },
              ]

      - step: "Post journal entry c"
        action: "call"
        target: "move_c"
        method: "action_post"

      - step: "Assert header totals by direction"
        action: "assert"
        target: "budget"
        asserts:
          amount_planned_revenue:
            type: "value"
            expected: 1000000.0
          amount_realized_revenue:
            type: "value"
            expected: 600000.0
          amount_diff_revenue:
            type: "value"
            expected: 400000.0
          amount_planned_cost:
            type: "value"
            expected: 400000.0
          amount_realized_cost:
            type: "value"
            expected: 150000.0
          amount_diff_cost:
            type: "value"
            expected: 250000.0
          amount_planned:
            type: "value"
            expected: 600000.0
          amount_realized:
            type: "value"
            expected: 450000.0
          amount_diff:
            type: "value"
            expected: 150000.0

      - step: "Search summary line of revenue account"
        action: "search"
        model: "financial_budget.summary"
        domain:
          - ["budget_id", "=", "REC: budget.id"]
          - ["account_id", "=", "REC: account_r.id"]
        save_as: "summary_r"
        expect_count: 1

      - step: "Assert summary line of revenue account"
        action: "assert"
        target: "summary_r"
        asserts:
          direction:
            type: "value"
            expected: "revenue"
          amount_planned:
            type: "value"
            expected: 1000000.0
          amount_realized:
            type: "value"
            expected: 600000.0

      - step: "Search summary line of cost account"
        action: "search"
