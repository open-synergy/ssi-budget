          direction: "cost"
          amount: 250000

      - step: "Change amount of line A"
        action: "write"
        target: "detail_a"
        values:
          amount: 1500000

      - step: "Assert planned amount follows the edit"
        action: "assert"
        target: "budget"
        asserts:
          amount_planned:
            type: "value"
            expected: 1750000.0

  - name: "Financial Budget - Detail line requires an account"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
