options:
  auto_refresh: true

scenarios:
  - name: "Financial Budget - Full Workflow: draft to done"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period Jan 2024 FB"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-01-01"
          date_end: "2024-01-31"

      - step: "Setup - create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type"
          code: "TFBT"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Assert budget created in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm budget"
        action: "call"
        target: "budget"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve to open"
        action: "call"
        target: "budget"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Done budget"
        action: "call"
        target: "budget"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Financial Budget Type - Master Data"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB MD"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period Mar 2024 FB"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-03-01"
          date_end: "2024-03-31"

      - step: "Create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type MD"
          code: "TFBTMD"

      - step: "Assert type created"
        action: "assert"
        target: "budget_type"
        asserts:
          name:
            type: "value"
            expected: "Test Financial Budget Type MD"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Assert budget in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Financial Budget - Reject: confirm to reject"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB Reject"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period Feb 2024 FB"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-02-01"
          date_end: "2024-02-29"

      - step: "Setup - create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type Reject"
          code: "TFBTRJ"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Confirm budget"
        action: "call"
        target: "budget"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Reject budget (must not raise ValueError on state)"
        action: "call"
        target: "budget"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "reject"

  - name: "Financial Budget - Planned amount sums detail amounts"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB AMT"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period FB AMT"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-04-01"
          date_end: "2024-04-30"

      - step: "Setup - create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type AMT"
          code: "TFBAMT"

      - step: "Setup - create revenue account A"
        action: "create"
        model: "account.account"
        save_as: "account_a"
        values:
          name: "Test Budget Account A AMT"
          code: "TBAAMT"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - create cost account B"
        action: "create"
        model: "account.account"
        save_as: "account_b"
        values:
          name: "Test Budget Account B AMT"
          code: "TBBAMT"
          user_type_id: "REF: account.data_account_type_expenses"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Create detail line A (revenue)"
        action: "create"
        model: "financial_budget.detail"
        save_as: "detail_a"
        values:
          budget_id: "EVAL: registry['budget'].id"
          account_id: "EVAL: registry['account_a'].id"
          direction: "revenue"
          amount: 1000000

      - step: "Create detail line B (cost)"
        action: "create"
        model: "financial_budget.detail"
        save_as: "detail_b"
        values:
          budget_id: "EVAL: registry['budget'].id"
          account_id: "EVAL: registry['account_b'].id"
          direction: "cost"
          amount: 250000

      - step: "Assert planned amount is the sum of the lines"
        action: "assert"
        target: "budget"
        asserts:
          amount_planned:
            type: "value"
            expected: 1250000.0

      - step: "Search summary line of account A"
        action: "search"
        model: "financial_budget.detail_summary"
        domain:
          - ["budget_id", "=", "REC: budget.id"]
          - ["account_id", "=", "REC: account_a.id"]
        save_as: "summary_a"
        expect_count: 1

      - step: "Assert summary amount of account A"
        action: "assert"
        target: "summary_a"
        asserts:
          amount:
            type: "value"
            expected: 1000000.0

      - step: "Search summary line of account B"
        action: "search"
        model: "financial_budget.detail_summary"
        domain:
          - ["budget_id", "=", "REC: budget.id"]
          - ["account_id", "=", "REC: account_b.id"]
        save_as: "summary_b"
        expect_count: 1

      - step: "Assert summary amount of account B"
        action: "assert"
        target: "summary_b"
        asserts:
          amount:
            type: "value"
            expected: 250000.0

  - name: "Financial Budget - Planned amount follows edited line"
    steps:
