      - step: "Save detail form without account"
        action: "form"
        model: "financial_budget.detail"
        expect_error:
          type: "AssertionError"
          message_contains: "is a required field"
        values:
          budget_id: "REC: budget"
          direction: "revenue"
          amount: 100.0
