scenarios:
  - name: "Financial Budget - Full Workflow: draft to done"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period Jan 2024 FB"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-01-01"
          date_end: "2024-01-31"

      - step: "Setup - create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type"
          code: "TFBT"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Assert budget created in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm budget"
        action: "call"
        target: "budget"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "budget"
        method: "invalidate_cache"

      - step: "Approve to open"
        action: "call"
        target: "budget"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "budget"
        method: "invalidate_cache"

      - step: "Done budget"
        action: "call"
        target: "budget"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Financial Budget Type - Master Data"
    steps:
      - step: "Setup - create date range type"
        action: "create"
        model: "date.range.type"
        save_as: "date_range_type"
        values:
          name: "Test Fiscal Month Type FB MD"
          fiscal_month: true

      - step: "Setup - create date range period"
        action: "create"
        model: "date.range"
        save_as: "period"
        values:
          name: "Test Period Mar 2024 FB"
          type_id: "EVAL: registry['date_range_type'].id"
          date_start: "2024-03-01"
          date_end: "2024-03-31"

      - step: "Create financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "Test Financial Budget Type MD"
          code: "TFBTMD"

      - step: "Assert type created"
        action: "assert"
        target: "budget_type"
        asserts:
          name:
            type: "value"
            expected: "Test Financial Budget Type MD"

      - step: "Create financial budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "budget"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['budget_type'].id"
          period_id: "EVAL: registry['period'].id"

      - step: "Assert budget in draft"
        action: "assert"
        target: "budget"
        asserts:
          state:
            type: "value"
            expected: "draft"
