        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2036_01.id"
          parent_id: "REC: parent.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "revenue",
                  amount: 700000,
                },
              ]

      - step: "Monthly 2 of 600000 exceeds the parent"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2036_02.id"
          parent_id: "REC: parent.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "revenue",
                  amount: 600000,
                },
              ]

      - step: "Setup - cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        values:
          name: "FBY reason child1"
          code: "FBY-CHILD1"

      - step: "Cancel child1 by wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "child1"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Monthly 2 of 600000 fits once monthly 1 is cancelled"
        action: "create"
        model: "financial_budget.budget"
        save_as: "child2"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2036_02.id"
          parent_id: "REC: parent.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "revenue",
                  amount: 600000,
                },
              ]

      - step: "Restart monthly 1 would exceed the parent"
        action: "call"
        target: "child1"
        method: "action_restart"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"

