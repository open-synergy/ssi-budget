        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2034_01.id"
          parent_id: "REC: parent.id"
          company_id: "REC: other_company.id"

      - step: "Monthly with an account missing in the parent"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2034_01.id"
          parent_id: "REC: parent.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_b'].id",
                  direction: "revenue",
                  amount: 100,
                },
              ]

      - step: "Monthly with another direction"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2034_01.id"
          parent_id: "REC: parent.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "cost",
                  amount: 100,
                },
              ]

      - step: "Yearly budget with a parent"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"
          parent_id: "REC: parent.id"

      - step: "Valid monthly budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "child"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2034_01.id"
          parent_id: "REC: parent.id"
          detail_ids:
