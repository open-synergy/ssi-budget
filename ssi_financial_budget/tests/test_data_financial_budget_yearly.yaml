options:
  auto_refresh: true

scenarios:
  - name: "Financial Budget Yearly - Periodicity default and accepted periods"
    steps:
      - step: "Setup - fiscal month range type"
        action: "create"
        model: "date.range.type"
        save_as: "fm_type"
        values:
          name: "FBY Fiscal Month S1"
          fiscal_month: true

      - step: "Setup - yearly range type"
        action: "create"
        model: "date.range.type"
        save_as: "yr_type"
        values:
          name: "FBY Yearly S1"

      - step: "Setup - set the yearly range type on the company"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: "EVAL: registry['yr_type'].id"

      - step: "Setup - range Year"
        action: "create"
        model: "date.range"
        save_as: "year"
        values:
          name: "Year S1"
          type_id: "REC: yr_type"
          date_start: "2031-01-01"
          date_end: "2031-12-31"

      - step: "Setup - range M2031-01"
        action: "create"
        model: "date.range"
        save_as: "m2031_01"
        values:
          name: "M2031-01 S1"
          type_id: "REC: fm_type"
          date_start: "2031-01-01"
          date_end: "2031-01-31"

      - step: "Setup - account A"
        action: "create"
        model: "account.account"
        save_as: "account_a"
        values:
          name: "FBY Account A S1"
          code: "YAS1"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - account B"
        action: "create"
        model: "account.account"
        save_as: "account_b"
        values:
          name: "FBY Account B S1"
          code: "YBS1"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "FBY Type S1"
          code: "FBYS1"
          allowed_account_ids:
            "EVAL: [(6, 0, [registry['account_a'].id, registry['account_b'].id])]"

      - step: "Create monthly budget without periodicity"
        action: "create"
        model: "financial_budget.budget"
        save_as: "monthly"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          period_id: "REC: m2031_01.id"

      - step: "Assert default periodicity is monthly"
        action: "assert"
        target: "monthly"
        asserts:
          periodicity:
            type: "value"
            expected: "monthly"

      - step: "Create yearly budget with the company yearly range"
        action: "create"
        model: "financial_budget.budget"
        save_as: "yearly"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"

      - step: "Assert yearly periodicity"
        action: "assert"
        target: "yearly"
        asserts:
          periodicity:
            type: "value"
            expected: "yearly"

  - name: "Financial Budget Yearly - Period must match the periodicity"
    steps:
      - step: "Setup - fiscal month range type"
        action: "create"
        model: "date.range.type"
        save_as: "fm_type"
        values:
          name: "FBY Fiscal Month S2"
          fiscal_month: true

      - step: "Setup - yearly range type"
        action: "create"
        model: "date.range.type"
        save_as: "yr_type"
        values:
          name: "FBY Yearly S2"

      - step: "Setup - set the yearly range type on the company"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: "EVAL: registry['yr_type'].id"

      - step: "Setup - range Year"
        action: "create"
        model: "date.range"
        save_as: "year"
        values:
          name: "Year S2"
          type_id: "REC: yr_type"
          date_start: "2032-01-01"
          date_end: "2032-12-31"

      - step: "Setup - range M2032-01"
        action: "create"
        model: "date.range"
        save_as: "m2032_01"
        values:
          name: "M2032-01 S2"
          type_id: "REC: fm_type"
          date_start: "2032-01-01"
          date_end: "2032-01-31"

      - step: "Setup - account A"
        action: "create"
        model: "account.account"
        save_as: "account_a"
        values:
          name: "FBY Account A S2"
          code: "YAS2"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - account B"
        action: "create"
        model: "account.account"
        save_as: "account_b"
        values:
          name: "FBY Account B S2"
          code: "YBS2"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "FBY Type S2"
          code: "FBYS2"
          allowed_account_ids:
            "EVAL: [(6, 0, [registry['account_a'].id, registry['account_b'].id])]"

      - step: "Yearly budget with a fiscal month period"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: m2032_01.id"

      - step: "Monthly budget with a yearly period"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: year.id"

      - step: "Clear the yearly range type of the company"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: false

      - step: "Yearly budget while the company setting is empty"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"

  - name: "Financial Budget Yearly - Realization covers the whole year"
    steps:
      - step: "Setup - fiscal month range type"
        action: "create"
        model: "date.range.type"
        save_as: "fm_type"
        values:
          name: "FBY Fiscal Month S3"
          fiscal_month: true

      - step: "Setup - yearly range type"
        action: "create"
        model: "date.range.type"
        save_as: "yr_type"
        values:
