        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "revenue",
                  amount: 1200000,
                },
              ]

      - step: "Monthly outside the parent period"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: m2035_01.id"
          parent_id: "REC: parent.id"

      - step: "Monthly with another type"
        action: "create"
        model: "financial_budget.budget"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: budget_type2.id"
          periodicity: "monthly"
          period_id: "REC: m2034_01.id"
          parent_id: "REC: parent.id"

