      - step: "Setup - set the yearly range type on the company"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: "EVAL: registry['yr_type'].id"

      - step: "Setup - range Year"
        action: "create"
        model: "date.range"
        save_as: "year"
        values:
          name: "Year S3"
          type_id: "REC: yr_type"
          date_start: "2033-01-01"
          date_end: "2033-12-31"

      - step: "Setup - range M2033-01"
        action: "create"
        model: "date.range"
        save_as: "m2033_01"
        values:
          name: "M2033-01 S3"
          type_id: "REC: fm_type"
          date_start: "2033-01-01"
          date_end: "2033-01-31"

      - step: "Setup - account A"
        action: "create"
        model: "account.account"
        save_as: "account_a"
        values:
          name: "FBY Account A S3"
          code: "YAS3"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - balancing account"
        action: "create"
        model: "account.account"
        save_as: "account_bal"
        values:
          name: "FBY Account BAL S3"
          code: "YBLS3"
          user_type_id: "REF: account.data_account_type_current_assets"

      - step: "Setup - journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "FBY Journal S3"
          code: "YS3"
          type: general

      - step: "Setup - financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "FBY Type S3"
          code: "FBYS3"
          allowed_account_ids: "EVAL: [(6, 0, [registry['account_a'].id])]"

      - step: "Create yearly budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "yearly"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"
          detail_ids:
            - [
                0,
                0,
                {
                  account_id: "EVAL: registry['account_a'].id",
                  direction: "revenue",
                  amount: 5000000,
                },
              ]

      - step: "Create journal entry 1"
        action: "create"
        model: "account.move"
        save_as: "move0"
        values:
          journal_id: "REC: journal.id"
          date: "2033-03-10"
          line_ids:
            - [
                0,
                0,
                {
                  name: "Budget line",
                  account_id: "EVAL: registry['account_a'].id",
                  debit: 0.0,
                  credit: 1000000.0,
                },
              ]
            - [
                0,
                0,
                {
                  name: "Balancing line",
                  account_id: "EVAL: registry['account_bal'].id",
                  debit: 1000000.0,
                  credit: 0.0,
                },
              ]

      - step: "Post journal entry 1"
        action: "call"
        target: "move0"
        method: "action_post"

      - step: "Create journal entry 2"
        action: "create"
        model: "account.move"
        save_as: "move1"
        values:
          journal_id: "REC: journal.id"
          date: "2033-08-20"
          line_ids:
            - [
                0,
                0,
                {
                  name: "Budget line",
                  account_id: "EVAL: registry['account_a'].id",
                  debit: 0.0,
                  credit: 2000000.0,
                },
              ]
            - [
                0,
                0,
                {
                  name: "Balancing line",
                  account_id: "EVAL: registry['account_bal'].id",
                  debit: 2000000.0,
                  credit: 0.0,
                },
              ]

      - step: "Post journal entry 2"
        action: "call"
        target: "move1"
        method: "action_post"

      - step: "Assert realized amount covers both months"
        action: "assert"
        target: "yearly"
        asserts:
          amount_realized:
            type: "value"
            expected: 3000000.0

  - name: "Financial Budget Yearly - Monthly budget must match its parent"
    steps:
      - step: "Setup - fiscal month range type"
        action: "create"
        model: "date.range.type"
        save_as: "fm_type"
        values:
          name: "FBY Fiscal Month S4"
          fiscal_month: true

      - step: "Setup - yearly range type"
