      - step: "Setup - range month 1"
        action: "create"
        model: "date.range"
        save_as: "month1"
        values:
          name: "FBH M1 S3"
          type_id: "REC: fm_type"
          date_start: "2053-01-01"
          date_end: "2053-01-28"

      - step: "Setup - range month 2"
        action: "create"
        model: "date.range"
        save_as: "month2"
        values:
          name: "FBH M2 S3"
          type_id: "REC: fm_type"
          date_start: "2053-02-01"
          date_end: "2053-02-28"

      - step: "Setup - range month 3"
        action: "create"
        model: "date.range"
        save_as: "month3"
        values:
          name: "FBH M3 S3"
          type_id: "REC: fm_type"
          date_start: "2053-03-01"
          date_end: "2053-03-28"

      - step: "Setup - account"
        action: "create"
        model: "account.account"
        save_as: "account_a"
        values:
          name: "FBH Account S3"
          code: "FBHS3"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - financial budget type"
        action: "create"
        model: "financial_budget.type"
        save_as: "budget_type"
        values:
          name: "FBH Type S3"
          code: "FBHT3"
          allowed_account_ids: "EVAL: [(6, 0, [registry['account_a'].id])]"

      - step: "Setup - yearly budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "yearly"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "yearly"
          period_id: "REC: year.id"

      - step: "Setup - first monthly budget under the yearly budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "child1"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: month1.id"
          parent_id: "REC: yearly.id"

      - step: "Setup - second monthly budget under the yearly budget"
        action: "create"
        model: "financial_budget.budget"
        save_as: "child2"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: month2.id"
          parent_id: "REC: yearly.id"

      - step: "Setup - orphan monthly budget without a parent"
        action: "create"
        model: "financial_budget.budget"
        save_as: "orphan"
        as_user: "base.user_admin"
        values:
          type_id: "REC: budget_type.id"
          periodicity: "monthly"
          period_id: "REC: month3.id"

      - step: "Monthly budgets with a parent are never roots"
        action: "search"
        model: "financial_budget.budget"
        save_as: "child_roots"
        domain:
          - ["parent_id", "=", false]
          - ["id", "in", "EVAL: [registry['child1'].id, registry['child2'].id]"]
        expect_count: 0

      - step: "Assert the orphan monthly budget has no children"
        action: "assert"
        target: "orphan"
        asserts:
          child_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
