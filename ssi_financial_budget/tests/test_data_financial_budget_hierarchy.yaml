      - step: "Setup - set the yearly range type on the company"
        action: "write"
        target: "company"
        values:
          financial_budget_yearly_range_type_id: "EVAL: registry['yr_type'].id"

      - step: "Setup - range Year"
        action: "create"
        model: "date.range"
        save_as: "year"
        values:
          name: "FBH Year S3"
          type_id: "REC: yr_type"
          date_start: "2053-01-01"
